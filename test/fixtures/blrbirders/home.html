s<br />• Comfortable walking shoes (avoid slippers or thin-soled sandals—the path is unpaved)<br />•⁠ ⁠Rainwear or warm clothing, depending on the weather forecast</p> <p><!-- /wp:paragraph --></p> <p><!-- wp:paragraph --></p> <p><strong>What to bring:</strong><br />• Binoculars, bird books/apps<br />• Camera<br />• Notebook/sketchpad and pencil (optional)<br />• Drinking water and snacks</p> <p><!-- /wp:paragraph --></p> <p><!-- wp:paragraph --></p> <p><strong>Nearby facilities:</strong><br />Restaurants and washrooms are available at<br />• The Bay, EcoSpace Food Court: https://maps.app.goo.gl/aycdV3gUcrkpRmt18?g_st=ipc (Paid parking)<br />• The Marketplace, Adarsh Palm Retreat (approx. 500 m from the lake, paid valet parking available): <a href='https://maps.app.goo.gl/qtccHTP4mvUX1Bj66?g_st=ipc' target='_blank' rel='noreferrer noopener'>Google Map</a></p> <p><!-- /wp:paragraph --></p> <p><!-- wp:paragraph {'placeholder':'Add Event Description...','lock':{'move':false,'remove':false},'extended_widget_opts':{'id_base':-1,'column':{'desktop':'12','tablet':'12','mobile':'12'},'alignment':{'desktop':'default','tablet':'default','mobile':'default'},'roles':{'state':'','options':'hide'},'visibility':{'selected':'0','options':'hide','acf':{'visibility':'hide','field':'','condition':'','value':''}},'author_page':{'author_pages':{'selections':'1'}},'devices':{'options':'hide'},'days':{'options':'hide'},'dates':{'options':'hide','from':'','to':''},'styling':{'selected':'0','bg_image':'','background':'','background_hover':'','heading':'','text':'','links':'','links_hover':'','border_color':'','border_type':'','border_width':'','background_input':'','text_input':'','border_color_input':'','border_type_input':'','border_width_input':'','background_submit':'','background_submit_hover':'','text_submit':'','border_color_submit':'','border_type_submit':'','border_width_submit':'','list_border_color':'','table_border_color':''},'class':{'selected':'0','link':'','id':'','classes':'
