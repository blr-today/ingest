                "description": "&lt;div class=&quot;et-l et-l--post&quot;&gt;    &lt;div class=&quot;et_builder_inner_content et_pb_gutters3&quot;&gt;&lt;div class=&quot;et_pb_section et_pb_section_4 et_section_regular&quot; &gt;                                   &lt;div class=&quot;et_pb_row et_pb_row_5&quot;&gt;     &lt;div class=&quot;et_pb_column et_pb_column_4_4 et_pb_column_4  et_pb_css_mix_blend_mode_passthrough et-last-child&quot;&gt;                         &lt;div class=&quot;et_pb_module et_pb_text et_pb_text_4  et_pb_text_align_left et_pb_bg_layout_light&quot;&gt;                         &lt;div class=&quot;et_pb_text_inner&quot;&gt;&lt;img decoding=&quot;async&quot; src=&quot;https://indianmusicexperience.org/wp-content/uploads/2026/11/banner-parvathy-baul-6af8571da283e.webp&quot;/&gt;&lt;/p&gt; &lt;h2&gt;Vasu Dixit, Composer &#038; Musician in Conversation with Parvathy Baul&lt;/h2&gt; &lt;p&gt;What does it mean to devote one&#8217;s life to a musical and spiritual tradition? And how does one find one&#8217;s own voice within a practice shaped by generations of practitioners?&lt;/p&gt; &lt;p&gt;In this edition of ‘Musicians in the Museum’, composer and musician Vasu Dixit will be in conversation with Parvathi Baul, one of the foremost practitioners of the Baul tradition. The conversation will trace Parvathi&#8217;s journey into Baul Sangeet, exploring the experiences, encounters and influences that have shaped her artistic and spiritual practice.&lt;/p&gt; &lt;p&gt;From her early encounters with the tradition to a life dedicated to its music, philosophy and performance, the conversation will also reflect on what it means to be a woman practising and carrying forward a tradition in which women practitioners have historically been fewer in number.&lt;/p&gt; &lt;p&gt;Through personal anecdotes and reflections on music, devotion and the transmission of cultural knowledge, the programme offers an opportunity to encounter the world of Baul music through the lived experience of one of its most distinctive contemporary voices.&lt;/p&gt; &lt;h3&gt;About the Artist: Parvathy Baul&lt;/h3&gt; &lt;div class=&quot;figure&quot;&gt;&lt;img decoding=&quot;async&quot; src=&quot;https://indianmusicexperience.org/wp-content/uploads/2026/11/thumb-parvathy-baul-6af8571cb9b65.webp&quot;/&gt;&lt;br /&gt; Parvathy Baul is a practitioner, performer and teacher of the Baul tradition from Bengal. An accomplished singer, instrumentalist, storyteller and painter, her practice emerges from the lineage of two eminent Baul masters, Sri Sanatan Das Thakur Baul and Sri Shashanko Goshai, under whom she studied closely. Rooted in a deep spiritual practice, her performances have taken her to over 40 countries and renowned international festivals and cultural institutions. A recipient of the 2019 Sangeet Natak Akademi Award, Parvathy is also committed to preserving and transmitting the Baul tradition through Sanatan Siddhashram, which she established in West Bengal, and her work in making traditional Baul learning accessible to women.&lt;/p&gt; &lt;h3&gt;About the Interlocuto&lt;/h3&gt; &lt;p&gt;&lt;img decoding=&quot;async&quot; src=&quot;https://indianmusicexperience.org/wp-content/uploads/2026/11/img-parvathy-baul-6af8595ccda05.webp&quot;/&gt;&lt;br /&gt; Vasu Dixit is a Bengaluru-based musician, composer and filmmaker, best known as the lead vocalist of the folk-rock band Swarathma, which he formed in 2002. A graduate of the National Institute of Design, Ahmedabad, Vasu brings together his interests in music, visual arts and storytelling in his creative practice. In 2017, he founded the Vasu Dixit Collective, an ensemble that explores electronic folk and folk-rock, drawing inspiration from Kannada and Hindi poetry and the works of saint poets such as Purandara Dasa, Basavanna and Kabir. His work reflects an ongoing exploration of musical traditions through contemporary expression.&lt;/p&gt; &lt;h3&gt;About the Series: Musicians in the Museum&lt;/h3&gt; &lt;p&gt;Musicians in the Museum is a series of artist conversations at the Indian Music Experience Museum that offers audiences an opportunity to understand the people and experiences behind the music. Through conversations with musicians from different genres and generations, the series explores their personal, professional and artistic journeys – from their early influences and formative experiences to their creative processes, challenges and evolving practices.&lt;/p&gt; &lt;p&gt;Previous editions have featured artists including Indian Ocean, Sumangala Damodaran and Dr Jayanthi Kumaresh. The series creates a space for audiences to engage with musicians beyond the stage and gain a deeper understanding of the stories, ideas and influences that shape their work.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Date and time:&lt;/strong&gt; &lt;br /&gt;21 November 2026, Saturday&lt;br /&gt;11:30 AM&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Venue:&lt;/strong&gt; &lt;br /&gt;IME Museum,&lt;br /&gt;JP Nagar 7th phase,&lt;br /&gt;Bengaluru – 560078&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Registration:&lt;/strong&gt; &lt;br /&gt;&lt;a href=&quot;https://forms.gle/TrfVvURM5vRKJB5B9&quot; target=&quot;_blank&quot;&gt;Click Here&lt;/a&gt;&lt;/div&gt; &lt;p&gt;&lt;strong&gt;Ticket:&lt;/strong&gt; &lt;br /&gt; Free to attend with RSVP&lt;/div&gt;    &lt;/div&gt;    &lt;/div&gt;                        &lt;/div&gt;              &lt;/div&gt;  &lt;/div&gt;  &lt;/div&gt;  ",

                "description": "&lt;div class=&quot;et-l et-l--post&quot;&gt;    &lt;div class=&quot;et_builder_inner_content et_pb_gutters3&quot;&gt;&lt;div class=&quot;et_pb_section et_pb_section_23 et_section_regular&quot; &gt;                                   &lt;div class=&quot;et_pb_row et_pb_row_24&quot;&gt;     &lt;div class=&quot;et_pb_column et_pb_column_4_4 et_pb_column_23  et_pb_css_mix_blend_mode_passthrough et-last-child&quot;&gt;                         &lt;div class=&quot;et_pb_with_border et_pb_module et_pb_text et_pb_text_23  et_pb_text_align_left et_pb_bg_layout_light&quot;&gt;                         &lt;div class=&quot;et_pb_text_inner&quot;&gt;&lt;img decoding=&quot;async&quot; src=&quot;https://indianmusicexperience.org/wp-content/uploads/2026/10/banner-killabeatmaker-6adf1dd3ef243.webp&quot;/&gt;&lt;/p&gt; &lt;h2&gt;Ancestral rhythms on the global dance floor curated by IME at the Humming Tree&lt;/h2&gt; &lt;p&gt;What happens when the sounds of Colombia meet the pulse of contemporary electronic music? Find out at this special live performance by Colombian DJ, producer and musician Killabeatmaker,curated by the Indian Music Experience Museum in collaboration with one of India’s biggest annual, international roots music festivals Jodhpur RIFF at the Humming Tree, Indiranagar. &lt;/p&gt; &lt;p&gt;Known for bringing Afro-Colombian and Indigenous musical influences into conversation with electronic beats, deep bass and global club sounds, Killabeatmaker creates music that connects cultural roots with contemporary experimentation. The result is a high-energy, rhythm-driven sound that moves between the familiar and the unexpected, tradition and technology, listening and dancing.&lt;/p&gt; &lt;p&gt;For IME, this collaboration attests to our commitment to honour music as a living, evolving language shaped by exchange, experimentation and new generations of artists. Join us for an evening that brings global musical cultures into dialogue and opens up new ways of experiencing what music can be.&lt;/p&gt; &lt;h3&gt;About the artist: &lt;a href=&quot;https://www.youtube.com/channel/UCOr3T8GigveEEzSa8q3Ohgw&quot; target=&quot;_blank&quot;&gt;Killabeatmaker&lt;/a&gt;&lt;/h3&gt; &lt;p&gt;Hilder Brando Osorno, known professionally as Killabeatmaker, is a DJ, producer and singer-songwriter from Medellín, Colombia. His work draws on Afro-Colombian and Indigenous musical influences, regional rhythms and African-rooted sounds, combining them with electronic production, urban beats and global club culture. His live performances bring together DJ sets, vocals, freestyle, beatboxing and the energy of live musicians.&lt;/p&gt; &lt;p&gt;With Guadalupe Giraldo on percussion, gaita and vocals, and Yulian Perc on percussion and vocals, the live setup blends traditional Colombian instruments with electronic sequences, synthesizers and powerful basslines. The result is an immersive performance that moves between organic percussion and electronic sound, cultural memory and forward-looking experimentation.&lt;/p&gt; &lt;h3&gt;About &lt;a href=&quot;https://jodhpurriff.org/&quot; target=&quot;_blank&quot;&gt;Jodhpur RIFF&lt;/a&gt;&lt;/h3&gt; &lt;p&gt;Jodhpur RIFF is an annual music festival held at Mehrangarh Fort in Jodhpur, dedicated to celebrating and sustaining the world&#8217;s living musical traditions. It brings together hereditary and folk musicians, contemporary artists and international performers, creating opportunities for musical exchange across cultures and generations. Its programming connects the preservation of musical heritage with new collaborations and creative possibilities.&lt;/p&gt; &lt;h3&gt;About &lt;a href=&quot;https://www.instagram.com/the_hummingtree/&quot; target=&quot;_blank&quot;&gt;The Humming Tree&lt;/a&gt;&lt;/h3&gt; &lt;p&gt;The Humming Tree has been an important part of Bengaluru&#8217;s independent music and arts ecosystem since its original run from 2013 to 2019. Reopened in 2026 in a new, purpose-designed space in Indiranagar, it continues to provide a platform for live music, artistic experimentation and cultural exchange.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Date and time:&lt;/strong&gt; &lt;br /&gt;01 November 2026, Saturday&lt;br /&gt;09:00 PM&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Venue:&lt;/strong&gt; &lt;br /&gt;The Humming Tree, &lt;br /&gt;763, 100 Feet Rd, HAL 2nd Stage, &lt;br /&gt;Appareddipalya, Indiranagar, Bengaluru, Karnataka 560008&lt;br /&gt; &lt;a href=&quot;https://maps.app.goo.gl/5rF531XkAGF1iUqw8&quot; target=&quot;_blank&quot;&gt;View map&lt;/a&gt;&lt;/p&gt; &lt;h6 style=&quot;margin-top:-30px;margin-bottom: 30px;&quot;&gt;&lt;i&gt;Please note, this event will NOT be at the Indian Music Experience Museum in JP Nagar&lt;/i&gt;&lt;/h6&gt; &lt;p&gt;&lt;strong&gt;Registration:&lt;/strong&gt; &lt;br /&gt;&lt;a href=&quot;https://www.district.in/events/the-humming-tree-x-indian-music-experience-x-jodhpur-riff-present-killabeatmaker-colombia-nov1-2026-buy-tickets&quot; target=&quot;_blank&quot;&gt;Click Here&lt;/a&gt;&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Ticket:&lt;/strong&gt; &lt;br /&gt;Rs. 200/-&lt;/div&gt;    &lt;/div&gt;    &lt;/div&gt;                        &lt;/div&gt;              &lt;/div&gt;  &lt;/div&gt;  &lt;/div&gt;  ",
