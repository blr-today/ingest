name: Update Data

on:
  workflow_dispatch:
  push:
  schedule:
    # https://crontab.guru/#17_6,18_*_*_*
    # Times in IST(+5:30): 5:47, 11:47, 17:47, 23:47
    - cron: '17 0,6,12,18 * * *'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  runner:
    name: Pick runner
    runs-on: ubuntu-26.04
    outputs:
      labels: ${{ steps.pick.outputs.labels }}
    steps:
    - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      id: app-token
      continue-on-error: true
      with:
        client-id: ${{ vars.PUBLISH_APP_ID }}
        private-key: ${{ secrets.PUBLISH_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        permission-organization-self-hosted-runners: read
    - name: Use sel when it is online
      id: pick
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        ORG: ${{ github.repository_owner }}
      run: |
        labels='"ubuntu-26.04"'
        if [ -n "$GH_TOKEN" ] && gh api "orgs/$ORG/actions/runners" \
          --jq '.runners[] | select(.status == "online") | .labels[].name' | grep -x sel > /dev/null; then
          labels='["self-hosted","sel","steamos"]'
        fi
        echo "Running on $labels"
        echo "labels=$labels" >> "$GITHUB_OUTPUT"

  update:
    needs: runner
    permissions:
      contents: write
    # sel avoids cloud IP blocks (District); GitHub-hosted is the fallback
    uses: ./.github/workflows/build.yml
    with:
      runs-on: ${{ needs.runner.outputs.labels }}
    secrets:
      TYPESAFE_JEV_API_KEY: ${{ secrets.TYPESAFE_JEV_API_KEY }}
      BRIGHT_DATA_API_KEY: ${{ secrets.BRIGHT_DATA_API_KEY }}

  fallback:
    needs: [runner, update]
    if: ${{ failure() && contains(needs.runner.outputs.labels, 'sel') && needs.update.outputs.built != 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      runs-on: '"ubuntu-26.04"'
    secrets:
      TYPESAFE_JEV_API_KEY: ${{ secrets.TYPESAFE_JEV_API_KEY }}
      BRIGHT_DATA_API_KEY: ${{ secrets.BRIGHT_DATA_API_KEY }}

  comment:
    needs: [update, fallback]
    if: ${{ !cancelled() && (needs.update.outputs.built == 'true' || needs.fallback.result == 'success') && github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-26.04
    name: Comment on PR
    # Branch builds link their events.db on the PR instead of committing out/
    permissions:
      pull-requests: write
    steps:
    - name: Link the database
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        BRANCH: ${{ github.ref_name }}
        ARTIFACT_URL: ${{ needs.update.outputs.artifact-url || needs.fallback.outputs.artifact-url }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        SHA: ${{ github.sha }}
      run: |
        pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
        [ -n "$pr" ] || exit 0
        gh pr comment "$pr" --edit-last --create-if-none --body-file - <<EOF
        Database for $SHA: $ARTIFACT_URL

        Run: $RUN_URL
        EOF

  release:
    needs: [update, fallback]
    if: ${{ !cancelled() && (needs.update.outputs.built == 'true' || needs.fallback.result == 'success') && github.event_name == 'schedule' }}
    runs-on: ubuntu-26.04
    name: Release
    steps:
    - name: fetch from artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: events-db
        path: .
    - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      id: app-token
      with:
        client-id: ${{ vars.PUBLISH_APP_ID }}
        private-key: ${{ secrets.PUBLISH_PRIVATE_KEY }}
        repositories: dataset
        permission-contents: write
    - name: publish dataset
      env:
        GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        export VERSION=$(date '+%Y.%-m.%-d-%H')
        gh release create "v$VERSION" events.db --repo=blr-today/dataset --notes "blr.today dataset release. See LICENSE.txt for license information before using this dataset."
  publish:
    needs: [update, fallback]
    if: ${{ !cancelled() && (needs.update.outputs.built == 'true' || needs.fallback.result == 'success') }}
    runs-on: ubuntu-26.04
    name: Publish Website
    steps:
      - name: trigger build on netlify
        run: curl -X POST -d '{}' "https://api.netlify.com/build_hooks/${BUILD_HOOK_SECRET}"
        env:
          BUILD_HOOK_SECRET: ${{secrets.NETLIFY_BUILD_HOOK_SECRET}}
