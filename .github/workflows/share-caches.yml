name: Share runner caches

on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions: {}
jobs:
  runner:
    uses: ./.github/workflows/runner.yml
    secrets:
      PUBLISH_PRIVATE_KEY: ${{ secrets.PUBLISH_PRIVATE_KEY }}
  share:
    name: Upload BookMyShow and District pages
    needs: runner
    # Saves what a self-hosted runner already has, without crawling again
    if: contains(needs.runner.outputs.labels, 'self-hosted') && github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        activate-environment: true
    - name: Merge every folder into main's
      run: |
        uv sync --frozen
        for name in bms district; do
          for dir in "$HOME/.cache/$name"/*/; do
            [ "$dir" = "$HOME/.cache/$name/main/" ] && continue
            BMS_CACHE="$HOME/.cache/$name/main" DISTRICT_CACHE="$HOME/.cache/$name/main" \
              python -m src.common.restore "$name" "$dir"
          done
          rm -rf "$name-pages" && cp -a "$HOME/.cache/$name/main" "$name-pages"
        done
    - name: Save BookMyShow pages
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: bms-pages
        key: "cache-bms-main-${{ github.run_id }}"
    - name: Save District pages
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: district-pages
        key: "cache-district-main-${{ github.run_id }}"
