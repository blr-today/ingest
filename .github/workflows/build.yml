name: Build

on:
  workflow_call:
    inputs:
      runs-on:
        description: JSON runs-on value for the build job
        required: true
        type: string
    secrets:
      TYPESAFE_JEV_API_KEY:
        description: TypeSafe key for sources that use Jev
        required: false
    outputs:
      built:
        description: Whether events.db was uploaded
        value: ${{ jobs.update.outputs.built }}
      artifact-url:
        description: Download link for events.db
        value: ${{ jobs.update.outputs.artifact-url }}
permissions: {}
jobs:
  update:
    permissions:
      contents: write
    name: Update data
    outputs:
      built: ${{ steps.upload.outputs.artifact-id != '' }}
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    steps:
    # This needs to come before the checkout, since checkout depends on git
    - name: Install Dependencies
      if: runner.environment == 'github-hosted'
      run: |
        sudo apt-get update && sudo apt-get install --yes libnss3 nss-plugin-pem ca-certificates wget jq git \
        libatk1.0-0 libatk-bridge2.0-0 libcups2 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libxkbcommon0 libpango-1.0-0 libcairo2 libasound2 libatspi2.0-0
        
        sudo mkdir -p -m 755 /etc/apt/keyrings \
        && wget -qO- https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null \
        && sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg \
        && echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null \
        && sudo apt update \
        && sudo apt install gh -y

        wget "https://github.com/lexiforest/curl-impersonate/releases/download/v2.2.3/curl-impersonate-v2.2.3.x86_64-linux-gnu.tar.gz" -O /tmp/curl-impersonate.tar.gz
        echo "ca7c8aae49e33260d3a2400db16c7737aaf04692d606a843502056b42990f989  /tmp/curl-impersonate.tar.gz" | sha256sum --check --status
        sudo tar -xzf /tmp/curl-impersonate.tar.gz -C /usr/bin

        wget "https://github.com/lightpanda-io/browser/releases/download/0.4.1/lightpanda-x86_64-linux" -O /tmp/lightpanda
        echo "1d40801e72c0bc61b2cbd3f3562bcfc46de7b79e0568f33f686b64f2e587610a  /tmp/lightpanda" | sha256sum --check --status
        sudo install -m 755 /tmp/lightpanda /usr/bin/lightpanda
    - name: Install Dependencies (self-hosted)
      if: runner.environment == 'self-hosted'
      run: |
        missing=""
        for tool in git gh jq wget curl; do
          command -v "$tool" > /dev/null || missing="$missing $tool"
        done
        if [ -n "$missing" ]; then
          echo "::error::Missing on $RUNNER_NAME:$missing"
          exit 1
        fi
        bin="$RUNNER_TOOL_CACHE/ingest-bin"
        mkdir -p "$bin"
        if [ ! -x "$bin/curl_chrome150" ]; then
          wget -q "https://github.com/lexiforest/curl-impersonate/releases/download/v2.2.3/curl-impersonate-v2.2.3.x86_64-linux-gnu.tar.gz" -O "$RUNNER_TEMP/curl-impersonate.tar.gz"
          echo "ca7c8aae49e33260d3a2400db16c7737aaf04692d606a843502056b42990f989  $RUNNER_TEMP/curl-impersonate.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/curl-impersonate.tar.gz" -C "$bin"
        fi
        if [ ! -x "$bin/lightpanda" ]; then
          wget -q "https://github.com/lightpanda-io/browser/releases/download/0.4.1/lightpanda-x86_64-linux" -O "$RUNNER_TEMP/lightpanda"
          echo "1d40801e72c0bc61b2cbd3f3562bcfc46de7b79e0568f33f686b64f2e587610a  $RUNNER_TEMP/lightpanda" | sha256sum --check --status
          install -m 755 "$RUNNER_TEMP/lightpanda" "$bin/lightpanda"
        fi
        echo "$bin" >> "$GITHUB_PATH"
    - name: Cache Requests SQLite
      # sel keeps its cache on disk between runs
      if: runner.environment == 'github-hosted'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/event-fetcher-cache.sqlite
        key: "cache-requests-${{ github.run_id }}"
        restore-keys: "cache-requests-"
    - name: Cache Jev Tags
      if: runner.environment == 'github-hosted'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ingest-activities.sqlite
        key: "cache-activities-${{ github.run_id }}"
        restore-keys: "cache-activities-"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      name: Clone self repository
      with:
        ref: ${{ github.head_ref }}
        persist-credentials: false

    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        activate-environment: true
    - name: Setup
      run: |
        git config --global init.defaultBranch main
        git config --global extensions.partialClone true
        uv sync --frozen
    - name: Fetch updates
      env:
        TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_JEV_API_KEY }}
      run: |
        # List BookMyShow fills this on sel; each branch reads only its own
        export BMS_CACHE="$HOME/.cache/bms/${GITHUB_REF_NAME//\//-}"
        make clean && make -s all
    - name: Upload Artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      id: upload
      with:
        name: events-db
        path: |
          events.db
        if-no-files-found: error
        # Branch links on the PR outlive a day of review
        retention-days: ${{ github.ref == 'refs/heads/main' && 1 || 7 }}
        overwrite: true

    # Commit back some data so we can keep track of diffs, on main only
    - name: Commit
      if: github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ github.token }}
        ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        git add --ignore-removal --update out/
        git diff --cached --quiet && exit 0
        git -c user.name='github-actions[bot]' \
          -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
          commit -F - <<EOF
        Automatic Updates 🤖

        Database URL: $ARTIFACT_URL
        Run: $RUN_URL
        Workflow: $RUN_URL/workflow
        EOF
        gh auth setup-git
        # Long builds and re-runs start from an older main
        git pull --rebase -X theirs
        git push
