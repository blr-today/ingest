[project]
name = "blr-today-ingest"
version = "0.0.1"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4~=4.15",
    "cleanurl~=0.1",
    "curl_cffi~=0.16",
    "datefinder~=0.7",  # 9bdb2311: 1.0 drops time parsing (upstream #68), wait for a stable release post 1.0.0rc3
    "html2text~=2025.4",
    "html5lib~=1.1",
    "ics~=0.7.3",
    "lxml~=6.1",
    "python-dateutil~=2.9",
    "python-jsonpath~=2.2",
    "pytz",
    "PyYAML~=6.0",
    "requests-cache~=1.3",
    "requests~=2.34",
    "ujson~=6.0",
    "urllib3~=2.8",
    "w3lib~=2.5",
    "pyld~=3.3",
    "jsonschema~=4.26.0",
    "protego>=0.6.0",
    "jsonnet>=0.21.0",
    "typesafe-sdk~=0.7.4",
]
[project.optional-dependencies]
test = [
    "coverage~=7.16",
    "pytest~=9.1",
    "pytest-httpbin~=2.1",
]
[tool.pytest.ini_options]
pythonpath = ["."]
[tool.coverage.run]
source = ["src"]
[tool.coverage.report]
include_namespace_packages = true
